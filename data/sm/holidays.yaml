# San Marino holidays: the list of Legge 152/1990 Art. 1 and 2, in force
# since 1 January 1991. Sundays are not listed (decision D7), Easter Sunday
# included. Art. 3 ended Saint Joseph, Ascension, Saints Peter and Paul,
# the afternoon of the last day of carnival, 14 and 16 August, 24 and 31
# December as holidays.

holidays:
  - id: sm.new-year
    names: {en: "Solemnity of Mary, Mother of God", it: Maria Santissima Madre di Dio}
    date: {type: fixed, month: 1, day: 1}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.epiphany
    names: {en: Epiphany, it: Epifania del Signore}
    date: {type: fixed, month: 1, day: 6}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.saint-agatha
    names: {en: Saint Agatha’s Day, it: "Sant’Agata, Compatrona della Repubblica"}
    date: {type: fixed, month: 2, day: 5}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.arengo
    names: {en: Anniversary of the Arengo, it: Arengo}
    date: {type: fixed, month: 3, day: 25}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.captains-regent-april
    names: {en: Investiture of the Captains Regent, it: Ingresso dei Capitani Reggenti}
    date: {type: fixed, month: 4, day: 1}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.easter-monday
    names: {en: Easter Monday, it: Lunedì di Pasqua}
    date: {type: easter, offset: 1}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.labour-day
    names: {en: Labour Day, it: Festa del lavoro}
    date: {type: fixed, month: 5, day: 1}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.corpus-christi
    names: {en: Corpus Christi, it: Santissimo Corpo e Sangue di Cristo}
    note: The Thursday after Trinity Sunday (Legge 152/1990 Art. 1).
    date: {type: easter, offset: 60}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.fall-of-fascism
    names: {en: Anniversary of the Fall of Fascism, it: Anniversario della Caduta del Fascismo}
    note: >-
      Legge 152/1990 calls it "Caduta del Fascismo". A bill of 2013 renames it
      "Anniversario della Caduta del Fascismo e Festa della Libertà"; whether
      it was enacted is an open point (docs/verification/sm.md). The school
      calendar 2026–2027 uses the name given here.
    date: {type: fixed, month: 7, day: 28}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026, calendario-scolastico-2026-2027]}

  - id: sm.assumption
    names: {en: Assumption Day, it: Assunzione della Beata Vergine Maria}
    date: {type: fixed, month: 8, day: 15}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.national-day
    names: {en: "Feast of Saint Marinus, Founder of the Republic", it: "San Marino, Patrono e Fondatore della Repubblica"}
    date: {type: fixed, month: 9, day: 3}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.captains-regent-october
    names: {en: Investiture of the Captains Regent, it: Ingresso dei Capitani Reggenti}
    date: {type: fixed, month: 10, day: 1}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.all-saints
    names: {en: All Saints’ Day, it: Tutti i Santi}
    date: {type: fixed, month: 11, day: 1}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.all-souls
    names: {en: All Souls’ Day, it: Commemorazione dei defunti}
    date: {type: fixed, month: 11, day: 2}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.immaculate-conception
    names: {en: Immaculate Conception, it: Immacolata Concezione della Beata Vergine Maria}
    date: {type: fixed, month: 12, day: 8}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.christmas
    names: {en: Christmas Day, it: Natale del Signore}
    date: {type: fixed, month: 12, day: 25}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

  - id: sm.saint-stephen
    names: {en: Saint Stephen’s Day, it: Santo Stefano}
    note: Legge 152/1990 Art. 2 says only "il 26 dicembre".
    date: {type: fixed, month: 12, day: 26}
    observances:
      - {regions: all, type: public, sources: [legge-152-1990, calendario-uffici-2026]}

# France. Regions: only the ISO 3166-2:FR subdivisions whose holidays differ
# from the national list (decision D-fr-1): the three departments of
# Alsace-Moselle and the overseas departments and collectivities where the
# Code du travail sets an extra day. Every other part of metropolitan France
# (and Saint-Pierre-et-Miquelon) has exactly the nationwide days: query
# without a region. French Polynesia, New Caledonia and Wallis and Futuna
# have their own labour codes and are not covered.
#
# Types in this file:
# - public: a "jour férié" designated by law, i.e. one of the "fêtes légales"
#   of Code du travail L3133-1, or a day added by L3134-13 (Alsace-Moselle)
#   or L3422-2 (overseas). Nationally only 1 May is also compulsorily a day
#   off (L3133-4); whether the other days are worked is set by collective
#   agreement (L3133-3-1). In Alsace-Moselle every jour férié is a day off
#   (L3134-13). The line is "designated jour férié by law", not "day off for
#   every employee" (decision D-fr-2).
# - observance: a day the law makes a jour férié only in part of a region
#   (Good Friday in Alsace-Moselle, decision D-fr-3, after D4 and D6).

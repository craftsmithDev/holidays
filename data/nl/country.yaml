# Netherlands. Regions: the 12 provinces and the three special
# municipalities of the Caribbean Netherlands (Bonaire, Saba, Sint
# Eustatius), all first-level subdivisions of ISO 3166-2:NL. Aruba, Curaçao
# and Sint Maarten (NL-AW, NL-CW, NL-SX) are countries of the Kingdom with
# their own law and their own ISO 3166-1 codes; they are not listed
# (decision D-bnl-3).
#
# Types in this file (decision D-bnl-2):
# - European Netherlands: no law gives employees a day off on a holiday; the
#   collective agreement (cao) or the contract decides (Rijksoverheid).
#   public: an “algemeen erkende feestdag” of the Algemene termijnenwet,
#   Art. 3 para. 1, that is a general day off in practice.
#   observance: Good Friday (equal to those days only for time limits,
#   Art. 3 para. 2) and Liberation Day (in Art. 3 para. 1, but a day off only
#   under some cao's, many of them only every fifth year).
# - Caribbean Netherlands (NL-BQ1, NL-BQ2, NL-BQ3), from 10 October 2010:
#   public: a holiday of the Arbeidswet 2000 BES, Art. 23 (paid; work on it
#   paid double). observance: a day of the Algemene termijnenwet (which
#   applies there by its Art. 5a) that is not in Art. 23.
code: NL

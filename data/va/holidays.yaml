  - id: va.papal-election-anniversary
    names: {en: Anniversary of the Election of the Pope, it: Anniversario dell’elezione del Sommo Pontefice}
    note: >-
      John Paul II elected 16 October 1978 (died 2 April 2005); Benedict XVI
      elected 19 April 2005 (resigned 28 February 2013); Francis elected 13
      March 2013 (died 21 April 2025); Leo XIV elected 8 May 2025. No
      anniversary in the year of an election.
    date:
      - {type: fixed, month: 10, day: 16, from: 1979, to: 2004}
      - {type: fixed, month: 4, day: 19, from: 2006, to: 2012}
      - {type: fixed, month: 3, day: 13, from: 2014, to: 2025}
      - {type: fixed, month: 5, day: 8, from: 2026}
    observances:
      - {regions: all, type: public, sources: [rgcr-1999, regolamento-governatorato-2010, rpcr-2025]}

  - id: va.ascension
    names: {en: Ascension Day, it: Ascensione del Signore}
    date: {type: easter, offset: 39}
    observances:

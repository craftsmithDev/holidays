  - id: va.papal-name-day
    names: {en: Name Day of the Pope, it: Onomastico del Sommo Pontefice}
    note: >-
      John Paul II (Karol): Saint Charles Borromeo, 4 November. Francis
      (Jorge): Saint George, 23 April. Leo XIV (Robert): Saint Robert
      Bellarmine, 17 September, first held on 17 September 2025 (Vatican
      News). Benedict XVI (Joseph): 19 March, see va.saint-joseph.
    date:
      - {type: fixed, month: 11, day: 4, from: 1978, to: 2004}
      - {type: fixed, month: 4, day: 23, from: 2013, to: 2024}
      - {type: fixed, month: 9, day: 17, from: 2025}
    observances:
      - {regions: all, type: public, sources: [rgcr-1999, regolamento-governatorato-2010, rpcr-2025, vaticannews-leo-name-day]}


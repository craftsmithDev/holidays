# Luxembourg. Regions: none. The holidays do not differ within the country,
# so the 12 cantons of ISO 3166-2:LU are not listed (decision D-bnl-4).
#
# Types in this file:
# - public: a “jour férié légal” of the Code du travail, Art. L. 232-2 (until
#   2006: law of 10 April 1976, Art. 2), paid and not worked in the private
#   sector.
# - bank: a day the collective agreement of the banking sector treats as a
#   bank holiday (Guichet.lu): Good Friday and Christmas Eve afternoon.
#
# Sunday rule (Art. L. 232-3): a holiday on a Sunday, or two holidays on the
# same day, gives each employee a compensatory day off within three months.
# The employer and employee choose the day, so no substitute is modelled.
code: LU
names: {lb: Lëtzebuerg, fr: Luxembourg, de: Luxemburg, en: Luxembourg}
languages: [lb, fr, de]
regions: []

# Portuguese holidays at national and regional level.
#
# public: the mandatory holidays of the Labour Code (Código do Trabalho
# Art. 234 since 2009, Art. 208 of the 2003 code), and the regional holidays
# of the Azores (PT-20) and Madeira (PT-30) set by regional decree.
# observance: Carnival, an optional holiday (Art. 235 / 2003 code Art. 209).
#
# Before 1 December 2003 the holidays were set by Decreto-Lei n.º 874/76 (the
# 2003 code names it among the laws it replaces). That decree was not read;
# its list for 2000–2003 is taken to be the one the 2003 code carried over.
# See docs/verification/pt.md.
#
# Lei n.º 23/2012 removed Corpus Christi, 5 October, 1 November and
# 1 December with effect from 1 January 2013; Lei n.º 8/2016 restored them
# from 2 April 2016. They are not holidays in 2013, 2014 and 2015.
#
# Easter Sunday (Domingo de Páscoa) is a mandatory holiday too, but always a
# Sunday and not listed (decision D7). Municipal holidays (feriado municipal,
# one per municipality) are not modelled.

holidays:
  - id: pt.new-year
    names: {en: New Year’s Day, pt: Ano Novo}
    date: {type: fixed, month: 1, day: 1}
    observances:
      - {regions: all, type: public, sources: [ct-2003, ct-2009]}

  - id: pt.shrove-tuesday
    names: {en: Carnival, pt: Carnaval}
    date: {type: easter, offset: -47}
    observances:
      - regions: all
        type: observance
        sources: [ct-2003, ct-2009]
        note: Optional holiday (feriado facultativo); a day off only where a collective agreement or the employment contract grants it. The government often gives its own staff the day off (tolerância de ponto) by yearly order; that is not modelled.

  - id: pt.good-friday
    names: {en: Good Friday, pt: Sexta-Feira Santa}
    date: {type: easter, offset: -2}
    observances:
      - regions: all
        type: public
        sources: [ct-2003, ct-2009]
        note: The law allows Good Friday to be observed on another day of local significance in the Easter period (Art. 234 n.º 2); such local moves are not modelled.

  - id: pt.madeira-autonomy-day
    names: {en: Autonomy Day, pt: Dia da Autonomia}
    date: {type: fixed, month: 4, day: 2}
    from: 2025
    observances:
      - regions: [PT-30]
        type: public
        sources: [madeira-dlr-17-2024-m]
        note: Instituted by Decreto Legislativo Regional n.º 17/2024/M, in force since 17 December 2024; first observed on 2 April 2025.

  - id: pt.freedom-day
    names: {en: Freedom Day, pt: Dia da Liberdade}
    date: {type: fixed, month: 4, day: 25}
    observances:
      - {regions: all, type: public, sources: [ct-2003, ct-2009]}

  - id: pt.labour-day
    names: {en: Labour Day, pt: Dia do Trabalhador}
    date: {type: fixed, month: 5, day: 1}
    observances:
      - {regions: all, type: public, sources: [ct-2003, ct-2009]}

  - id: pt.azores-day
    names: {en: Azores Day, pt: Dia da Região Autónoma dos Açores}
    date: {type: easter, offset: 50}
    observances:
      - regions: [PT-20]
        type: public
        sources: [acores-dr-13-80-a]
        note: Monday of the Holy Spirit (segunda-feira do Espírito Santo), i.e. Whit Monday.

  - id: pt.corpus-christi
    names: {en: Corpus Christi, pt: Corpo de Deus}
    date: {type: easter, offset: 60}
    observances:
      - {regions: all, type: public, to: 2012, sources: [ct-2003, ct-2009, lei-23-2012]}
      - {regions: all, type: public, from: 2016, sources: [lei-8-2016]}

  - id: pt.national-day
    names: {en: Portugal Day, pt: "Dia de Portugal, de Camões e das Comunidades Portuguesas"}
    date: {type: fixed, month: 6, day: 10}
    observances:
      - {regions: all, type: public, sources: [ct-2003, ct-2009]}

  - id: pt.madeira-day
    names: {en: Madeira Day, pt: Dia da Região e das Comunidades Madeirenses}
    date: {type: fixed, month: 7, day: 1}
    observances:
      - regions: [PT-30]
        type: public
        sources: [madeira-dlr-18-2002-m, madeira-dlr-3-2004-m, madeira-dlr-39-2012-m]
        note: Regional holiday since Decreto Regional n.º 27/79/M (cited in the preamble of DLR 18/2002/M); confirmed as a regional holiday by DLR 3/2004/M Art. 7 and DLR 39/2012/M Art. 4.

  - id: pt.assumption
    names: {en: Assumption Day, pt: Assunção de Nossa Senhora}
    date: {type: fixed, month: 8, day: 15}
    observances:
      - {regions: all, type: public, sources: [ct-2003, ct-2009]}

  - id: pt.republic-day
    names: {en: Republic Day, pt: Implantação da República}
    date: {type: fixed, month: 10, day: 5}
    observances:
      - {regions: all, type: public, to: 2012, sources: [ct-2003, ct-2009, lei-23-2012]}
      - {regions: all, type: public, from: 2016, sources: [lei-8-2016]}

  - id: pt.all-saints
    names: {en: All Saints’ Day, pt: Dia de Todos-os-Santos}
    date: {type: fixed, month: 11, day: 1}
    observances:
      - {regions: all, type: public, to: 2012, sources: [ct-2003, ct-2009, lei-23-2012]}
      - {regions: all, type: public, from: 2016, sources: [lei-8-2016]}

  - id: pt.restoration-of-independence
    names: {en: Restoration of Independence, pt: Restauração da Independência}
    date: {type: fixed, month: 12, day: 1}
    observances:
      - {regions: all, type: public, to: 2012, sources: [ct-2003, ct-2009, lei-23-2012]}
      - {regions: all, type: public, from: 2016, sources: [lei-8-2016]}

  - id: pt.immaculate-conception
    names: {en: Immaculate Conception, pt: Imaculada Conceição}
    date: {type: fixed, month: 12, day: 8}
    observances:
      - {regions: all, type: public, sources: [ct-2003, ct-2009]}

  - id: pt.christmas
    names: {en: Christmas Day, pt: Natal}
    date: {type: fixed, month: 12, day: 25}
    observances:
      - {regions: all, type: public, sources: [ct-2003, ct-2009]}

  - id: pt.saint-stephen
    names: {en: First Octave of Christmas, pt: Primeira Oitava}
    date: {type: fixed, month: 12, day: 26}
    from: 2002
    observances:
      - regions: [PT-30]
        type: public
        sources: [madeira-dlr-18-2002-m, madeira-dlr-3-2004-m, madeira-dlr-39-2012-m]
        note: The law names the day only as 26 December; «primeira oitava» is the popular name given in the preamble of DLR 18/2002/M. In force since November 2002.

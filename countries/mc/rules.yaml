# Monaco holidays: the twelve jours fériés légaux of Loi n° 798 art. 1er.
#
# Sunday rule (Loi n° 798 art. 1er para. 2): when New Year's Day, 1 May,
# Assumption, All Saints, the Prince's Day or Christmas falls on a Sunday,
# the following Monday is a jour férié légal. Modelled as a substitute day
# (D10): the Sunday stays the holiday, the Monday is added. The yearly
# government circular lists such a Monday as "reporté au lundi".
#
# Immaculate Conception on a Sunday moves to Monday 9 December. The law does
# not say so; the government page and the circular for 2024 do (the FEDEM
# note of October 2024 reports the same for 2019), following the liturgical
# calendar. Modelled as a move (decision D-mc-2).
#
# Sainte-Dévote, Easter Monday, Ascension, Whit Monday and Corpus Christi
# have no Sunday rule (and only Sainte-Dévote can fall on a Sunday).

holidays:
  - id: mc.new-year
    names: {en: New Year’s Day, fr: Jour de l’An}
    date: {type: fixed, month: 1, day: 1}
    observances:
      - regions: all
        type: public
        substitute: {when: {weekday: [sun]}, avoidWeekdays: []}
        sources: [loi-798, loi-800, gouv-jours-feries]

  - id: mc.saint-devote
    names: {en: Saint Devota’s Day, fr: Sainte-Dévote}
    date: {type: fixed, month: 1, day: 27}
    observances:
      - regions: all
        type: public
        sources: [loi-798, loi-800, gouv-jours-feries, circulaire-2018-12]
        note: No Monday when it falls on a Sunday (not in the Sunday rule; the circular for 2019 lists Sunday 27 January only).

  - id: mc.easter-monday
    names: {en: Easter Monday, fr: Lundi de Pâques}
    date: {type: easter, offset: 1}
    observances:
      - {regions: all, type: public, sources: [loi-798, loi-800, gouv-jours-feries]}

  - id: mc.labour-day
    names: {en: Labour Day, fr: Fête du Travail}
    date: {type: fixed, month: 5, day: 1}
    observances:
      - regions: all
        type: public
        substitute: {when: {weekday: [sun]}, avoidWeekdays: []}
        sources: [loi-798, loi-800, gouv-jours-feries]

  - id: mc.ascension
    names: {en: Ascension Day, fr: Ascension}
    date: {type: easter, offset: 39}
    observances:
      - {regions: all, type: public, sources: [loi-798, loi-800, gouv-jours-feries]}

  - id: mc.whit-monday
    names: {en: Whit Monday, fr: Lundi de Pentecôte}
    date: {type: easter, offset: 50}
    observances:
      - {regions: all, type: public, sources: [loi-798, loi-800, gouv-jours-feries]}

  - id: mc.corpus-christi
    names: {en: Corpus Christi, fr: Fête-Dieu}
    date: {type: easter, offset: 60}
    observances:
      - {regions: all, type: public, sources: [loi-798, loi-800, gouv-jours-feries]}

  - id: mc.assumption
    names: {en: Assumption Day, fr: Assomption}
    date: {type: fixed, month: 8, day: 15}
    observances:
      - regions: all
        type: public
        substitute: {when: {weekday: [sun]}, avoidWeekdays: []}
        sources: [loi-798, loi-800, gouv-jours-feries, circulaire-2026-12]

  - id: mc.all-saints
    names: {en: All Saints’ Day, fr: Toussaint}
    date: {type: fixed, month: 11, day: 1}
    observances:
      - regions: all
        type: public
        substitute: {when: {weekday: [sun]}, avoidWeekdays: []}
        sources: [loi-798, loi-800, gouv-jours-feries, circulaire-2025-8]

  - id: mc.national-day
    names: {en: National Day (Prince’s Day), fr: Fête du Prince}
    note: >-
      Loi n° 798 names the feast day of the reigning Prince ("la fête du
      Prince régnant"), not a date. It has been 19 November under Rainier III
      and Albert II; a new reign could change it.
    date: {type: fixed, month: 11, day: 19}
    observances:
      - regions: all
        type: public
        substitute: {when: {weekday: [sun]}, avoidWeekdays: []}
        sources: [loi-798, loi-800, gouv-jours-feries, circulaire-2024-7, circulaire-2025-8, circulaire-2026-12]

  - id: mc.immaculate-conception
    names: {en: Immaculate Conception, fr: Immaculée Conception}
    date:
      type: fixed
      month: 12
      day: 8
      adjust:
        - when: {weekday: [sun]}
          moveTo: {weekday: mon, direction: after}
    observances:
      - regions: all
        type: public
        sources: [loi-798, loi-800, gouv-jours-feries, circulaire-2023-14]
        note: On a Sunday the day moves to Monday 9 December (government page; circular n° 2023-14 for 2024).

  - id: mc.christmas
    names: {en: Christmas Day, fr: Noël}
    date: {type: fixed, month: 12, day: 25}
    observances:
      - regions: all
        type: public
        substitute: {when: {weekday: [sun]}, avoidWeekdays: []}
        sources: [loi-798, loi-800, gouv-jours-feries]

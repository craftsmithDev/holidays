# Switzerland. Regions: the 26 cantons (ISO 3166-2:CH).
#
# Types in this file:
# - public: equal to Sunday under the Labour Act (ArG Art. 20a para. 1), i.e.
#   listed for the canton in the SECO list, or 1 August (federal holiday).
# - observance: a cantonal holiday that is customary or a cantonal rest day,
#   but not equal to Sunday under ArG Art. 20a in the whole canton.
code: CH
regions:
  - CH-AG
  - CH-AI
  - CH-AR
  - CH-BE
  - CH-BL
  - CH-BS
  - CH-FR
  - CH-GE
  - CH-GL
  - CH-GR
  - CH-JU
  - CH-LU
  - CH-NE
  - CH-NW
  - CH-OW
  - CH-SG
  - CH-SH
  - CH-SO
  - CH-SZ
  - CH-TG
  - CH-TI
  - CH-UR
  - CH-VD
  - CH-VS
  - CH-ZG
  - CH-ZH
sources:
  federal-constitution:
    title: Bundesverfassung der Schweizerischen Eidgenossenschaft
    publisher: Swiss Confederation (Fedlex)
    law: SR 101, Art. 110 para. 3
    url: https://www.fedlex.admin.ch/eli/cc/1999/404/de#art_110
    accessed: "2026-11-15"
  seco-art20a:
    title: "Anhang: Feiertage Schweiz (Auszug ArG/ArGV 1–5), Stand am 12.12.2024"
    publisher: State Secretariat for Economic Affairs SECO
    law: SR 822.11, ArG Art. 20a para. 1
    url: https://www.seco.admin.ch/dam/de/sd-web/x5LtHPJdNis5/Anhang-Feiertage-Schweiz-Auszug-ArG-ArGV1-5-SECO-SB-2024-DE.pdf
    accessed: "2026-11-15"
  ne-loi-dimanche:
    title: Loi sur le dimanche et les jours fériés, état au 1er janvier 2010
    publisher: République et Canton de Neuchâtel
    law: RSN 941.02, Art. 3
    url: https://rsn.ne.ch/DATA/program/books/rsne/pdf/94102.pdf
    accessed: "2026-11-15"
  gl-ruhetagsgesetz:
    title: Gesetz über die öffentlichen Ruhetage (Ruhetagsgesetz), Stand 1. Juli 2019
    publisher: Kanton Glarus
    law: GS IX B/21/1, Art. 2
    url: https://www.lexfind.ch/tol/6801/de
    accessed: "2026-11-15"

# Swiss holidays at canton level.
#
# Dates and cantons are ported from the visibility plugin (craftsmith), the
# reference dataset for this library (see sources.md). The type
# of each canton follows the SECO list of holidays equal to Sunday under the
# Labour Act (source seco-art20a): listed = public, otherwise observance.
#
# Holidays that only some municipalities or districts observe are not listed
# at canton level (e.g. Sechseläuten in the city of Zurich). Where a canton
# equates a day with Sunday only in some districts or municipalities, the
# canton-level entry is an observance and the note names those parts.

holidays:
  - id: ch.new-year
    names: {en: New Year’s Day, de: Neujahr, fr: Nouvel An, it: Capodanno, rm: Bumaun}
    date: {type: fixed, month: 1, day: 1}
    observances:
      - regions: all
        type: public
        sources: [seco-art20a]
      - regions: [CH-NE]
        type: public
        substitute: {when: {weekday: [sun]}, avoidWeekdays: []}
        sources: [seco-art20a, ne-loi-dimanche]
        note: When 1 January is a Sunday, 2 January is a rest day equal to Sunday (RSN 941.02 Art. 3).

  - id: ch.berchtold
    names: {en: Berchtold’s Day, de: Berchtoldstag, fr: Saint-Berthold, it: San Bertoldo, rm: Di da Berchtold}
    date: {type: fixed, month: 1, day: 2}
    observances:
      - regions: [CH-BE, CH-TG, CH-VD]
        type: public
        sources: [seco-art20a]
      - regions: [CH-GL, CH-JU, CH-LU, CH-OW, CH-SH, CH-SO, CH-ZG, CH-ZH]
        type: observance
        sources: [seco-art20a]
        note: Customary day off; not equal to Sunday under ArG Art. 20a.
      - regions: [CH-NE]
        type: observance
        sources: [seco-art20a, ne-loi-dimanche]
        note: Equal to Sunday only when 1 January is a Sunday; that case is the substitute day of ch.new-year. Otherwise customary.
      - regions: [CH-AG]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in the districts Aarau, Brugg, Kulm, Lenzburg, Zofingen and Zurzach and in Bergdietikon.
      - regions: [CH-FR]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in predominantly Reformed municipalities.

  - id: ch.epiphany
    names: {en: Epiphany, de: Heilige Drei Könige, fr: Épiphanie, it: Epifania, rm: Babania}
    date: {type: fixed, month: 1, day: 6}
    observances:
      - regions: [CH-TI]
        type: public
        sources: [seco-art20a]
      - regions: [CH-SZ, CH-UR]
        type: observance
        sources: [seco-art20a]
        note: Cantonal holiday; not equal to Sunday under ArG Art. 20a.

  - id: ch.republic-day
    names: {en: Republic Day, de: Jahrestag der Ausrufung der Republik, fr: Instauration de la République, it: Anniversario della Repubblica, rm: Instauraziun da la Republica}
    date: {type: fixed, month: 3, day: 1}
    observances:
      - regions: [CH-NE]
        type: public
        sources: [seco-art20a]

  - id: ch.saint-joseph
    names: {en: Saint Joseph’s Day, de: Josefstag, fr: Saint-Joseph, it: San Giuseppe, rm: Son Josef}
    date: {type: fixed, month: 3, day: 19}
    observances:
      - regions: [CH-SZ, CH-VS]
        type: public
        sources: [seco-art20a]
      - regions: [CH-NW, CH-TI, CH-UR]
        type: observance
        sources: [seco-art20a]
        note: Cantonal holiday; not equal to Sunday under ArG Art. 20a.

  - id: ch.good-friday
    names: {en: Good Friday, de: Karfreitag, fr: Vendredi saint, it: Venerdì santo, rm: Venderdi sontg}
    date: {type: easter, offset: -2}
    observances:
      - regions: all
        except: [CH-TI, CH-VS]
        type: public
        sources: [seco-art20a]

  - id: ch.easter-monday
    names: {en: Easter Monday, de: Ostermontag, fr: Lundi de Pâques, it: Lunedì dell’Angelo, rm: Glindesdi da Pasca}
    date: {type: easter, offset: 1}
    observances:
      - regions: [CH-AI, CH-AR, CH-BE, CH-BL, CH-BS, CH-GE, CH-GL, CH-GR, CH-JU, CH-SG, CH-SH, CH-TG, CH-TI, CH-VD, CH-ZH]
        type: public
        sources: [seco-art20a]
      - regions: [CH-LU, CH-NE, CH-NW, CH-OW, CH-SO, CH-SZ, CH-UR, CH-ZG]
        type: observance
        sources: [seco-art20a]
        note: Customary day off; not equal to Sunday under ArG Art. 20a.
      - regions: [CH-AG]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in the districts Aarau, Baden, Brugg, Kulm, Lenzburg and Zofingen, in Bergdietikon and in eight municipalities of the district Rheinfelden.
      - regions: [CH-FR]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in predominantly Reformed municipalities.

  - id: ch.naefelser-fahrt
    names: {en: Näfels Pilgrimage, de: Näfelser Fahrt, fr: Fête de Näfels, it: Pellegrinaggio di Näfels, rm: Pelegrinadi da Näfels}
    note: First Thursday of April; one week later when that Thursday falls in Holy Week (2026 → 9 April).
    date:
      type: nthWeekday
      month: 4
      weekday: thu
      nth: 1
      adjust:
        - when: {between: {from: {type: easter, offset: -7}, to: {type: easter, offset: -1}}}
          offset: 7
    sources: [gl-ruhetagsgesetz]
    observances:
      - regions: [CH-GL]
        type: public
        sources: [seco-art20a]

  - id: ch.labour-day
    names: {en: Labour Day, de: Tag der Arbeit, fr: Fête du travail, it: Festa del lavoro, rm: Di da la lavur}
    date: {type: fixed, month: 5, day: 1}
    observances:
      - regions: [CH-BL, CH-BS, CH-JU, CH-NE, CH-SH, CH-ZH]
        type: public
        sources: [seco-art20a]
      - regions: [CH-SO]
        type: public
        startTime: "12:00"
        sources: [seco-art20a]
        note: Afternoon only, in the whole canton.
      - regions: [CH-TI]
        type: observance
        sources: [seco-art20a]
        note: Cantonal holiday; not equal to Sunday under ArG Art. 20a.

  - id: ch.ascension
    names: {en: Ascension Day, de: Auffahrt, fr: Ascension, it: Ascensione, rm: Ascensiun}
    date: {type: easter, offset: 39}
    observances:
      - regions: all
        type: public
        sources: [seco-art20a]

  - id: ch.whit-monday
    names: {en: Whit Monday, de: Pfingstmontag, fr: Lundi de Pentecôte, it: Lunedì di Pentecoste, rm: Glindesdi da Tschuncaisma}
    date: {type: easter, offset: 50}
    observances:
      - regions: [CH-AI, CH-AR, CH-BE, CH-BL, CH-BS, CH-GE, CH-GR, CH-JU, CH-SG, CH-SH, CH-TG, CH-VD, CH-ZH]
        type: public
        sources: [seco-art20a]
      - regions: [CH-LU, CH-NE, CH-NW, CH-OW, CH-SO, CH-SZ, CH-TI, CH-UR, CH-ZG]
        type: observance
        sources: [seco-art20a]
        note: Customary day off; not equal to Sunday under ArG Art. 20a.
      - regions: [CH-GL]
        type: observance
        sources: [seco-art20a, gl-ruhetagsgesetz]
        note: The Glarus Ruhetagsgesetz (Art. 2) lists Whit Monday as a public rest day equal to Sunday, but the SECO list does not count it for Glarus (ArG Art. 20a allows at most eight). See sources.md.
      - regions: [CH-AG]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in the districts Aarau, Baden, Brugg, Kulm, Lenzburg and Zofingen, in Bergdietikon and in eight municipalities of the district Rheinfelden.
      - regions: [CH-FR]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in predominantly Reformed municipalities.

  - id: ch.corpus-christi
    names: {en: Corpus Christi, de: Fronleichnam, fr: Fête-Dieu, it: Corpus Domini, rm: Sontgilcrest}
    date: {type: easter, offset: 60}
    observances:
      - regions: [CH-AI, CH-JU, CH-LU, CH-NW, CH-OW, CH-SZ, CH-UR, CH-VS, CH-ZG]
        type: public
        sources: [seco-art20a]
      - regions: [CH-TI]
        type: observance
        sources: [seco-art20a]
        note: Cantonal holiday; not equal to Sunday under ArG Art. 20a.
      - regions: [CH-FR]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in predominantly Catholic municipalities.
      - regions: [CH-AG]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in the districts Baden (except Bergdietikon), Bremgarten, Laufenburg, Muri and Zurzach and in six municipalities of the district Rheinfelden.
      - regions: [CH-SO]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday in the whole canton except the district Bucheggberg.
      - regions: [CH-NE]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in the municipality Le Landeron.

  - id: ch.jura-independence
    names: {en: Jura Independence Day, de: Fest der Unabhängigkeit, fr: Commémoration du plébiscite jurassien, it: Festa dell’indipendenza giurassiana, rm: Festa da l’independenza giurassiana}
    date: {type: fixed, month: 6, day: 23}
    observances:
      - regions: [CH-JU]
        type: observance
        sources: [seco-art20a]
        note: Cantonal holiday; not equal to Sunday under ArG Art. 20a (Jura already equates eight other days).

  - id: ch.peter-and-paul
    names: {en: Saints Peter and Paul, de: Peter und Paul, fr: Saint-Pierre et Saint-Paul, it: Santi Pietro e Paolo, rm: Son Pieder e Son Paul}
    date: {type: fixed, month: 6, day: 29}
    observances:
      - regions: [CH-TI]
        type: observance
        sources: [seco-art20a]
        note: Cantonal holiday; not equal to Sunday under ArG Art. 20a.

  - id: ch.national-day
    names: {en: Swiss National Day, de: Bundesfeier, fr: Fête nationale, it: Festa nazionale, rm: Festa naziunala}
    date: {type: fixed, month: 8, day: 1}
    observances:
      - regions: all
        type: public
        sources: [federal-constitution, seco-art20a]

  - id: ch.assumption
    names: {en: Assumption Day, de: Mariä Himmelfahrt, fr: Assomption, it: Assunzione, rm: Assumziun da Maria}
    date: {type: fixed, month: 8, day: 15}
    observances:
      - regions: [CH-LU, CH-NW, CH-OW, CH-SZ, CH-TI, CH-UR, CH-VS, CH-ZG]
        type: public
        sources: [seco-art20a]
      - regions: [CH-AI, CH-JU]
        type: observance
        sources: [seco-art20a]
        note: Cantonal holiday; not equal to Sunday under ArG Art. 20a.
      - regions: [CH-FR]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in predominantly Catholic municipalities.
      - regions: [CH-AG]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in the districts Bremgarten, Laufenburg and Muri and in six municipalities of the district Rheinfelden.
      - regions: [CH-SO]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday in the whole canton except the district Bucheggberg.

  - id: ch.jeune-genevois
    names: {en: Genevan Fast, de: Genfer Bettag, fr: Jeûne genevois, it: Digiuno ginevrino, rm: Jeûne genevois}
    note: Thursday after the first Sunday of September.
    date: {type: nthWeekday, month: 9, weekday: sun, nth: 1, offset: 4}
    observances:
      - regions: [CH-GE]
        type: public
        sources: [seco-art20a]

  - id: ch.federal-fast-monday
    names: {en: Federal Fast Monday, de: Bettagsmontag, fr: Lundi du Jeûne fédéral, it: Lunedì del Digiuno federale, rm: Glindesdi da la Rogaziun federala}
    note: Monday after the third Sunday of September (the Federal Day of Thanksgiving, Repentance and Prayer).
    date: {type: nthWeekday, month: 9, weekday: sun, nth: 3, offset: 1}
    observances:
      - regions: [CH-VD]
        type: public
        sources: [seco-art20a]

  - id: ch.saint-maurice
    names: {en: Saint Maurice’s Day, de: Mauritiustag, fr: Saint-Maurice, it: San Maurizio, rm: San Murezzan}
    date: {type: fixed, month: 9, day: 22}
    observances:
      - regions: [CH-AI]
        type: observance
        sources: [seco-art20a]
        note: Cantonal holiday; not equal to Sunday under ArG Art. 20a.

  - id: ch.bruder-klaus
    names: {en: Saint Nicholas of Flüe, de: Bruder Klaus, fr: Saint-Nicolas-de-Flüe, it: San Nicolao della Flüe, rm: Son Niclau da Flüe}
    date: {type: fixed, month: 9, day: 25}
    observances:
      - regions: [CH-OW]
        type: observance
        sources: [seco-art20a]
        note: Cantonal holiday; not equal to Sunday under ArG Art. 20a.

  - id: ch.all-saints
    names: {en: All Saints’ Day, de: Allerheiligen, fr: Toussaint, it: Ognissanti, rm: Numnasontga}
    date: {type: fixed, month: 11, day: 1}
    observances:
      - regions: [CH-GL, CH-LU, CH-NW, CH-OW, CH-SG, CH-SZ, CH-TI, CH-UR, CH-VS, CH-ZG]
        type: public
        sources: [seco-art20a]
      - regions: [CH-AI, CH-JU]
        type: observance
        sources: [seco-art20a]
        note: Cantonal holiday; not equal to Sunday under ArG Art. 20a.
      - regions: [CH-FR]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in predominantly Catholic municipalities.
      - regions: [CH-AG]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in the districts Bremgarten, Laufenburg, Muri and Zurzach and in the district Rheinfelden.
      - regions: [CH-SO]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday in the whole canton except the district Bucheggberg.

  - id: ch.immaculate-conception
    names: {en: Immaculate Conception, de: Mariä Empfängnis, fr: Immaculée Conception, it: Immacolata Concezione, rm: Immaculata Concepziun}
    date: {type: fixed, month: 12, day: 8}
    observances:
      - regions: [CH-NW, CH-OW, CH-UR, CH-VS, CH-ZG]
        type: public
        sources: [seco-art20a]
      - regions: [CH-AI, CH-LU, CH-SZ, CH-TI]
        type: observance
        sources: [seco-art20a]
        note: Cantonal holiday; not equal to Sunday under ArG Art. 20a.
      - regions: [CH-FR]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in predominantly Catholic municipalities.
      - regions: [CH-AG]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in the districts Laufenburg and Muri and in six municipalities of the district Rheinfelden.

  - id: ch.christmas
    names: {en: Christmas Day, de: Weihnachten, fr: Noël, it: Natale, rm: Nadal}
    date: {type: fixed, month: 12, day: 25}
    observances:
      - regions: all
        type: public
        sources: [seco-art20a]
      - regions: [CH-NE]
        type: public
        substitute: {when: {weekday: [sun]}, avoidWeekdays: []}
        sources: [seco-art20a, ne-loi-dimanche]
        note: When 25 December is a Sunday, 26 December is a rest day equal to Sunday (RSN 941.02 Art. 3).

  - id: ch.saint-stephen
    names: {en: Saint Stephen’s Day, de: Stephanstag, fr: Saint-Étienne, it: Santo Stefano, rm: Son Steffan}
    date: {type: fixed, month: 12, day: 26}
    observances:
      - regions: [CH-BE, CH-BL, CH-BS, CH-GL, CH-GR, CH-LU, CH-SG, CH-SH, CH-TG, CH-TI, CH-ZH]
        type: public
        sources: [seco-art20a]
      - regions: [CH-AI, CH-AR]
        type: public
        adjust:
          - when: {weekday: [tue, sat]}
            skip: true
        sources: [seco-art20a]
        note: Not observed when Christmas falls on a Monday or Friday, i.e. when it would make three rest days in a row (AR, AI).
      - regions: [CH-NW, CH-OW, CH-SO, CH-SZ, CH-UR, CH-ZG]
        type: observance
        sources: [seco-art20a]
        note: Customary day off; not equal to Sunday under ArG Art. 20a.
      - regions: [CH-AG]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in the districts Aarau, Baden, Bremgarten, Brugg, Kulm, Lenzburg, Zofingen and Zurzach, in Bergdietikon and in eight municipalities of the district Rheinfelden.
      - regions: [CH-FR]
        type: observance
        sources: [seco-art20a]
        note: Equal to Sunday only in predominantly Reformed municipalities.

  - id: ch.restoration
    names: {en: Restoration of the Republic, de: Wiederherstellung der Republik, fr: Restauration de la République, it: Restaurazione della Repubblica, rm: Restauraziun da la Republica}
    date: {type: fixed, month: 12, day: 31}
    observances:
      - regions: [CH-GE]
        type: public
        sources: [seco-art20a]

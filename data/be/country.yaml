# Belgium. Regions: the three regions of ISO 3166-2:BE (first level). The
# provinces (second level) are not listed; no holiday differs by province.
#
# Types in this file:
# - public: one of the ten days of the Holidays Act (Wet van 4 januari 1974,
#   Art. 4) as fixed by the Royal Decree of 18 April 1974 (Art. 1): a day on
#   which employees may not be made to work and are paid.
# - observance: a day off only for the federal public service (Royal Decree
#   of 19 November 1998, Art. 14), and the days of the three communities,
#   which are not general days off (decision D-bnl-1).
#
# Communities are not ISO 3166-2 subdivisions. Their days are mapped to the
# regions where the community has competence (decision D-bnl-1):
# Flemish Community -> BE-VLG, BE-BRU; French Community -> BE-WAL, BE-BRU;
# German-speaking Community -> BE-WAL (only its nine municipalities in the
# province of Liège, named in the note).
code: BE
names: {nl: België, fr: Belgique, de: Belgien, en: Belgium}
languages: [nl, fr, de]
regions:
  - {code: BE-BRU, names: {nl: Brussels Hoofdstedelijk Gewest, fr: Région de Bruxelles-Capitale, de: Region Brüssel-Hauptstadt, en: Brussels-Capital Region}}
  - {code: BE-VLG, names: {nl: Vlaams Gewest, fr: Région flamande, de: Flämische Region, en: Flemish Region}}
  - {code: BE-WAL, names: {nl: Waals Gewest, fr: Région wallonne, de: Wallonische Region, en: Walloon Region}}

# Vatican City State holidays.
#
# Two lists make up the year (sources in country.yaml):
# 1. The holy days of obligation of canon 1246 §1: Christmas, Epiphany,
#    Ascension, Corpus Christi, Mary Mother of God, Immaculate Conception,
#    Assumption, Saint Joseph, Saints Peter and Paul, All Saints. The
#    regulations refer to them as "le altre feste di precetto". Canon 1246
#    §2 lets a bishops' conference move Ascension and Corpus Christi to a
#    Sunday (Italy does); the data keeps the universal Thursdays, see
#    docs/verification/va.md.
# 2. The ten "giorni di vacanza" of the personnel regulations (RGCR 1999
#    Art. 50, Governatorato 2010 Art. 27, RPCR 2025 Art. 52, same wording).
#
# Sundays are not listed (decision D7), Easter Sunday included.
#
# Two days depend on the reigning pope: the anniversary of his election and
# his name day. Their rules end with each pontificate. The rules for
# Leo XIV have no end year; when the see falls vacant, end them and add the
# successor's days. Benedict XVI's name day (Joseph) is 19 March, already
# Saint Joseph, so it has no entry of its own.

holidays:
  - id: va.new-year
    names: {en: "Solemnity of Mary, Mother of God", it: Maria Santissima Madre di Dio}
    date: {type: fixed, month: 1, day: 1}
    observances:
      - {regions: all, type: public, sources: [cic-1246, rgcr-1999, regolamento-governatorato-2010, rpcr-2025]}

  - id: va.epiphany
    names: {en: Epiphany, it: Epifania del Signore}
    date: {type: fixed, month: 1, day: 6}
    observances:
      - {regions: all, type: public, sources: [cic-1246, rgcr-1999, regolamento-governatorato-2010, rpcr-2025]}

  - id: va.state-anniversary
    names: {en: Anniversary of the Foundation of Vatican City State, it: Anniversario dell’istituzione dello Stato della Città del Vaticano}
    note: >-
      The regulations name the day but not the date. 11 February is the day
      the Lateran Treaty was signed (1929); the regulation of the Opera
      Romana Pellegrinaggi lists the day as "11 febbraio, Anniversario della
      firma dei Patti Lateranensi". The treaty entered into force on 7 June
      1929; see docs/verification/va.md.
    date: {type: fixed, month: 2, day: 11}
    observances:
      - {regions: all, type: public, sources: [rgcr-1999, regolamento-governatorato-2010, rpcr-2025, orp-regolamento-2000]}

  - id: va.saint-joseph
    names: {en: Saint Joseph’s Day, it: San Giuseppe}
    date: {type: fixed, month: 3, day: 19}
    observances:
      - {regions: all, type: public, sources: [cic-1246, rgcr-1999, regolamento-governatorato-2010, rpcr-2025]}

  - id: va.maundy-thursday
    names: {en: Maundy Thursday, it: Giovedì santo}
    date: {type: easter, offset: -3}
    observances:
      - {regions: all, type: public, sources: [rgcr-1999, regolamento-governatorato-2010, rpcr-2025]}

  - id: va.good-friday
    names: {en: Good Friday, it: Venerdì santo}

# Germany. Regions: the 16 Länder (ISO 3166-2:DE).
#
# Holidays are Land law, except the Day of German Unity (Einigungsvertrag
# Art. 2 para. 2). Each Land lists its gesetzliche (staatlich anerkannte)
# Feiertage in its Feiertagsgesetz; these are days of general rest from work.
#
# Types in this file:
# - public: a gesetzlicher Feiertag in the whole Land under its Feiertagsgesetz
#   (or a one-off day declared by law or ordinance for the whole Land).
# - observance: a gesetzlicher Feiertag only in part of a Land (Augsburg,
#   Catholic municipalities, regions set by ordinance; decision D6), and
#   Christmas Eve and New Year's Eve, which are no Feiertage but days off for
#   federal civil servants (AZV § 6).
# Easter Sunday and Whit Sunday (Feiertage in Brandenburg) are not listed
# (decision D7).

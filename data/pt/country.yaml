# Portugal. Regions: the 18 districts and the 2 autonomous regions
# (ISO 3166-2:PT). The districts share the national holidays; only the
# autonomous regions (Açores PT-20, Madeira PT-30) add their own. Municipal
# holidays (feriado municipal) are not modelled (country and region only).
#
# Types in this file:
# - public: a mandatory holiday (feriado obrigatório) under the Labour Code
#   (Código do Trabalho of 2009, Art. 234; before it Art. 208 of the
#   2003 code), or a regional holiday set by a regional legislative decree of
#   the Azores or Madeira.
# - observance: an optional holiday (feriado facultativo, Labour Code
#   Art. 235): a day off only where a collective agreement or the employment
#   contract grants it.

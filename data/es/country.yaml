# Spain. Regions: the 17 autonomous communities and the autonomous cities of
# Ceuta and Melilla (ISO 3166-2:ES, first level).
#
# Types in this file:
# - public: a "fiesta laboral" for the community or city in the yearly BOE
#   resolution of the Dirección General de Trabajo (RD 2001/1983 Art. 45.4,
#   Estatuto de los Trabajadores Art. 37.2): paid, a day off for employees. A day
#   the BOE note calls "recuperable" stays public; the note says so.
# - observance: a day the BOE note names for only part of a community (an
#   island of the Canary Islands, the territory of Arán in Catalonia).
# Local (municipal) holidays are not listed (out of scope).

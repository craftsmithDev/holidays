# Italy. Regions: the 19 regions of ISO 3166-2:IT other than
# Trentino-Alto Adige (IT-32), plus its two autonomous provinces Bolzano
# (IT-BZ) and Trento (IT-TN), which ISO 3166-2:IT lists as subdivisions of
# their own. Together they cover Italy once (decision D-it-1). Only IT-BZ
# has a holiday of its own; every other entry is nationwide.
#
# Types in this file:
# - public: a "giorno festivo" agli effetti civili under Legge 27 maggio
#   1949 n. 260 Art. 2, as changed by Legge 54/1977, D.P.R. 792/1985,
#   Legge 336/2000 and Legge 151/2025 (or a one-off day declared festivo
#   "ai sensi degli articoli 2 e 4" of that law).
# - observance: a general day off that rests on collective agreements, not
#   on state law (Whit Monday in IT-BZ, see decision D-it-2).
#
# Municipal patron-saint days (Rome 29 June, Milan 7 December, …) are not
# listed; see docs/verification/it.md.
code: IT
names: {it: Italia, en: Italy}
languages: [it]
regions:
  - {code: IT-21, names: {it: Piemonte, en: Piedmont}}

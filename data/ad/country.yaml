# Andorra. Regions: the 7 parishes (ISO 3166-2:AD). The national holidays do
# not differ between them, so every entry is nationwide. Parish holidays (up to
# four per parish, set by each comú) are not listed (municipal level, out of
# scope).
#
# Types in this file:
# - public: a "dia de festa de compliment obligatori, retribuït i no
#   recuperable" in the yearly Govern decree on the labour calendar
#   (Llei 31/2018 de relacions laborals, Art. 62).
#
# Coverage: 2024-2027, the years for which the decree or the Govern's
# publication of it was read. Other years return nothing.
code: AD
names: {ca: Andorra, en: Andorra}
languages: [ca]
regions:
  - {code: AD-02, names: {ca: Canillo, en: Canillo}}
  - {code: AD-03, names: {ca: Encamp, en: Encamp}}
  - {code: AD-04, names: {ca: La Massana, en: La Massana}}
  - {code: AD-05, names: {ca: Ordino, en: Ordino}}
  - {code: AD-06, names: {ca: Sant Julià de Lòria, en: Sant Julià de Lòria}}
  - {code: AD-07, names: {ca: Andorra la Vella, en: Andorra la Vella}}
  - {code: AD-08, names: {ca: Escaldes-Engordany, en: Escaldes-Engordany}}

# French holidays.
#
# public: the eleven fêtes légales of Code du travail L3133-1 (nationwide),
# 26 December in Alsace-Moselle (L3134-13) and the commemoration of the
# abolition of slavery overseas (L3422-2; before 10 August 2016 loi n° 83-550
# and décret n° 83-1003). See the type line in country.yaml.
#
# Not listed: Easter Sunday and Whit Sunday (Sundays, D7); Mi-carême and the
# carnival days in some overseas departments, Good Friday and 21 July
# (Victor Schœlcher) in the Antilles: no law makes them jours fériés (see
# docs/verification/fr.md).

holidays:
  - id: fr.new-year
    names: {en: New Year’s Day, fr: Jour de l’An}
    date: {type: fixed, month: 1, day: 1}
    observances:
      - {regions: all, type: public, sources: [ct-l3133-1, service-public-f2405]}

  - id: fr.good-friday
    names: {en: Good Friday, fr: Vendredi saint}
    date: {type: easter, offset: -2}
    observances:
      - regions: [FR-57, FR-67, FR-68]
        type: observance
        sources: [ct-l3134-13, dreets-droit-local, service-public-f2405]
        note: >-
          A jour férié and day off only in the communes that have a Protestant
          church (temple) or a church shared by both confessions (église
          mixte), L3134-13. Most employers in Alsace-Moselle observe it, but
          the law does not cover the whole department (decision D-fr-3).

  - id: fr.easter-monday
    names: {en: Easter Monday, fr: Lundi de Pâques}
    date: {type: easter, offset: 1}
    observances:
      - {regions: all, type: public, sources: [ct-l3133-1, service-public-f2405]}

  - id: fr.abolition-of-slavery
    names: {en: Abolition of Slavery Day, fr: Commémoration de l’abolition de l’esclavage}
    note: >-
      One holiday, one date per territory (Code du travail L3422-2, décret
      n° 83-1003 art. 1er). The holiday date is the one of Guadeloupe and
      Saint-Martin; the other territories override it.
    date: {type: fixed, month: 5, day: 27}
    observances:
      - regions: [FR-976]
        type: public
        date: {type: fixed, month: 4, day: 27}
        sources: [ct-l3422-2, loi-83-550, decret-83-1003]
        note: >-
          Before 1 January 2018 Mayotte was outside the Code du travail; the
          day was a jour férié under loi n° 83-550 and the Code du travail
          applicable à Mayotte (former art. L222-1).
      - regions: [FR-972]
        type: public
        date: {type: fixed, month: 5, day: 22}
        sources: [ct-l3422-2, loi-83-550, decret-83-1003]
      - regions: [FR-971]
        type: public
        sources: [ct-l3422-2, loi-83-550, decret-83-1003]
      - regions: [FR-MF]
        type: public
        from: 2012
        sources: [ct-l3422-2, decret-2012-553, decret-83-1003]
        note: >-
          Since décret n° 2012-553 (in force 26 April 2012). From 10 August
          2016 to 31 December 2017 the first version of L3422-2 read
          "28 mars" for Saint-Martin, while the decree kept 27 May; 27 May
          2017 was observed (see docs/verification/fr.md, open points).
      - regions: [FR-973]
        type: public
        date: {type: fixed, month: 6, day: 10}
        sources: [ct-l3422-2, loi-83-550, decret-83-1003]
      - regions: [FR-BL]
        type: public
        from: 2012
        date: {type: fixed, month: 10, day: 9}
        sources: [ct-l3422-2, decret-2012-553, decret-83-1003]
        note: Since décret n° 2012-553 (in force 26 April 2012).
      - regions: [FR-974]
        type: public
        date: {type: fixed, month: 12, day: 20}
        sources: [ct-l3422-2, loi-83-550, decret-83-1003]

  - id: fr.labour-day
    names: {en: Labour Day, fr: Fête du Travail}
    date: {type: fixed, month: 5, day: 1}
    observances:
      - regions: all
        type: public
        sources: [ct-l3133-1, ct-l3133-4, service-public-f2405]
        note: The only jour férié that is a compulsory day off nationwide (L3133-4).

  - id: fr.victory-day
    names: {en: Victory in Europe Day, fr: Victoire 1945}
    date: {type: fixed, month: 5, day: 8}
    observances:
      - {regions: all, type: public, sources: [ct-l3133-1, service-public-f2405]}

  - id: fr.ascension
    names: {en: Ascension Day, fr: Ascension}
    date: {type: easter, offset: 39}
    observances:
      - {regions: all, type: public, sources: [ct-l3133-1, service-public-f2405]}

  - id: fr.whit-monday
    names: {en: Whit Monday, fr: Lundi de Pentecôte}
    date: {type: easter, offset: 50}
    observances:
      - regions: all
        type: public
        sources: [ct-l3133-1, ct-l3133-11, service-public-f2405]
        note: >-
          Still a fête légale (L3133-1). An employer may make it the unpaid
          journée de solidarité (L3133-11), so many employees work that day
          (decision D-fr-2). From 2005 to 2007 it was the default solidarity
          day unless an agreement chose another.

  - id: fr.national-day
    names: {en: National Day, fr: Fête nationale}
    date: {type: fixed, month: 7, day: 14}
    observances:
      - {regions: all, type: public, sources: [ct-l3133-1, service-public-f2405]}

  - id: fr.assumption
    names: {en: Assumption Day, fr: Assomption}
    date: {type: fixed, month: 8, day: 15}
    observances:
      - {regions: all, type: public, sources: [ct-l3133-1, service-public-f2405]}

  - id: fr.all-saints
    names: {en: All Saints’ Day, fr: Toussaint}
    date: {type: fixed, month: 11, day: 1}
    observances:
      - {regions: all, type: public, sources: [ct-l3133-1, service-public-f2405]}

  - id: fr.armistice-day
    names: {en: Armistice Day, fr: Armistice 1918}
    date: {type: fixed, month: 11, day: 11}
    observances:
      - {regions: all, type: public, sources: [ct-l3133-1, service-public-f2405]}

  - id: fr.christmas
    names: {en: Christmas Day, fr: Noël}
    date: {type: fixed, month: 12, day: 25}
    observances:
      - {regions: all, type: public, sources: [ct-l3133-1, service-public-f2405]}

  - id: fr.saint-stephen
    names: {en: Saint Stephen’s Day, fr: Saint-Étienne (second jour de Noël)}
    date: {type: fixed, month: 12, day: 26}
    observances:
      - regions: [FR-57, FR-67, FR-68]
        type: public
        sources: [ct-l3134-13, dreets-droit-local, service-public-f2405]

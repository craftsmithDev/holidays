# Andorra holidays: the 14 days of the yearly labour calendar decree.
#
# Every day is public for construction, industry, offices, banks,
# hairdressers, transport and services not directly related to tourism
# (decree Art. 1). In sectors directly related to tourism the same number of
# days applies, but they may be moved by agreement, except 1 January,
# 14 March, 8 September and 25 December (decree Art. 2).

holidays:
  - id: ad.new-year
    names: {en: New Year’s Day, ca: Cap d’Any}
    date: {type: fixed, month: 1, day: 1}
    observances:
      - {regions: all, type: public, from: 2024, to: 2027, sources: [ad-llei-31-2018, ad-decret-2024, ad-decret-2025, ad-govern-2026, ad-govern-2027]}

  - id: ad.epiphany
    names: {en: Epiphany, ca: Reis}
    date: {type: fixed, month: 1, day: 6}
    observances:
      - regions: all
        type: public
        from: 2024
        to: 2027
        sources: [ad-llei-31-2018, ad-decret-2024, ad-decret-2025, ad-govern-2026, ad-govern-2027]
        note: In sectors directly related to tourism this day may be moved by agreement (decree Art. 2).

  - id: ad.carnival
    names: {en: Carnival, ca: Carnaval}
    note: The decree sets the day each year; 2024 was a Tuesday (20 February), 2025-2027 the Monday before Ash Wednesday.
    date: {type: list, dates: ["2024-02-20", "2025-03-03", "2026-02-16", "2027-02-08"]}
    observances:
      - regions: all
        type: public
        sources: [ad-llei-31-2018, ad-decret-2024, ad-decret-2025, ad-govern-2026, ad-govern-2027]
        note: In sectors directly related to tourism this day may be moved by agreement (decree Art. 2).

  - id: ad.constitution-day

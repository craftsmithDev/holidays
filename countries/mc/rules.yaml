# Monaco. No regions: the holidays are the same in the whole principality
# (ISO 3166-2:MC lists 17 quarters; none has its own holiday).
#
# Types in this file:
# - public: a jour férié légal of Loi n° 798 art. 1. Loi n° 800 art. 2 makes
#   every one of them a compulsory paid day off for all employees.
code: MC
regions: []

# UK bank holidays by part of the UK.
#
# England and Wales (GB-ENG, GB-WLS) share one list. Scotland (GB-SCT) and
# Northern Ireland (GB-NIR) differ: Scotland has 2 January and St Andrew's
# Day but no Easter Monday, and its summer bank holiday is the first Monday
# in August; Northern Ireland adds St Patrick's Day and the Battle of the
# Boyne.
#
# Weekend rule: when a bank holiday falls on a Saturday or Sunday, the next
# weekday that is not already a bank holiday becomes a substitute bank holiday
# (Sch. 1 of the 1971 Act for Sundays, the yearly Royal Proclamations for
# Saturdays). Modelled as `substitute` with chaining, so Christmas on a
# Saturday gives Monday 27 and Boxing Day on the Sunday gives Tuesday 28. The
# weekend date itself stays in the list (decision D10); see D-gb-3.
#
# One-off and moved days are Royal Proclamations under s. 1(2) and 1(3) of the
# 1971 Act: 2002, 2011, 2012 from The Gazette; 2020, 2022, 2023 and 2026 from
# gov.uk.

holidays:
  - id: gb.new-year
    names: {en: New Year’s Day, cy: Dydd Calan}
    date: {type: fixed, month: 1, day: 1}
    observances:
      - regions: all
        type: public
        substitute: {when: {weekday: [sat, sun]}, avoidWeekdays: [sat, sun]}
        sources: [bfda-1971, govuk-bank-holidays]
        note: Scotland by Sch. 1 para. 2; England, Wales and Northern Ireland by Royal Proclamation each year.

  - id: gb.second-january
    names: {en: 2nd January, cy: 2il o Ionawr}
    date: {type: fixed, month: 1, day: 2}
    observances:
      - regions: [GB-SCT]
        type: public
        substitute: {when: {weekday: [sat, sun]}, avoidWeekdays: [sat, sun]}
        sources: [bfda-1971, govuk-bank-holidays]

  - id: gb.saint-patrick
    names: {en: St Patrick’s Day, cy: Gŵyl Sant Padrig}
    date: {type: fixed, month: 3, day: 17}
    observances:
      - regions: [GB-NIR]
        type: public
        substitute: {when: {weekday: [sat, sun]}, avoidWeekdays: [sat, sun]}
        sources: [bfda-1971, govuk-bank-holidays]

  - id: gb.good-friday
    names: {en: Good Friday, cy: Gwener y Groglith}
    date: {type: easter, offset: -2}
    observances:
      - regions: all
        type: public
        sources: [bfda-1971, govuk-bank-holidays]
        note: A bank holiday by Sch. 1 in Scotland; a customary (common law) holiday in England, Wales and Northern Ireland, listed by gov.uk.

  - id: gb.easter-monday
    names: {en: Easter Monday, cy: Llun y Pasg}
    date: {type: easter, offset: 1}
    observances:
      - regions: all
        except: [GB-SCT]
        type: public
        sources: [bfda-1971, govuk-bank-holidays]

  - id: gb.royal-wedding
    names: {en: Royal Wedding}
    date: {type: list, dates: ["2011-04-29"]}
    observances:
      - regions: all
        type: public
        sources: [gazette-2011-royal-wedding]
        note: Wedding of Prince William and Catherine Middleton; bank holiday by Royal Proclamation in all parts of the UK.

  - id: gb.early-may
    names: {en: Early May bank holiday, cy: Gŵyl banc dechrau Mai}
    date:
      - {type: nthWeekday, month: 5, weekday: mon, nth: 1, to: 2019}
      - {type: list, dates: ["2020-05-08"], from: 2020, to: 2020}
      - {type: nthWeekday, month: 5, weekday: mon, nth: 1, from: 2021}
    observances:
      - regions: all
        type: public
        sources: [bfda-1971, govuk-bank-holidays]
        note: Sch. 1 para. 2 in Scotland; by Royal Proclamation in England, Wales and Northern Ireland. In 2020 moved to Friday 8 May for the 75th anniversary of VE Day (gov.uk "Early May bank holiday (VE day)").

  - id: gb.coronation
    names: {en: Bank holiday for the coronation of King Charles III, cy: Gŵyl y banc ar gyfer coroni Brenin Siarl III}
    date: {type: list, dates: ["2023-05-08"]}
    observances:
      - regions: all
        type: public
        sources: [govuk-bank-holidays]

  - id: gb.spring-bank
    names: {en: Spring bank holiday, cy: Gŵyl banc y gwanwyn}
    date:
      - {type: nthWeekday, month: 5, weekday: mon, nth: -1, to: 2001}
      - {type: list, dates: ["2002-06-04"], from: 2002, to: 2002}
      - {type: nthWeekday, month: 5, weekday: mon, nth: -1, from: 2003, to: 2011}
      - {type: list, dates: ["2012-06-04"], from: 2012, to: 2012}
      - {type: nthWeekday, month: 5, weekday: mon, nth: -1, from: 2013, to: 2021}
      - {type: list, dates: ["2022-06-02"], from: 2022, to: 2022}
      - {type: nthWeekday, month: 5, weekday: mon, nth: -1, from: 2023}
    observances:
      - regions: all
        type: public
        sources: [bfda-1971, govuk-bank-holidays, gazette-2002-jubilee, gazette-2012-jubilee]
        note: Last Monday in May (Sch. 1 paras. 1 and 3; by Royal Proclamation in Scotland). Moved by proclamation for the jubilees to Tuesday 4 June 2002, Monday 4 June 2012 and Thursday 2 June 2022.

  - id: gb.golden-jubilee
    names: {en: Golden Jubilee}
    date: {type: list, dates: ["2002-06-03"]}
    observances:
      - regions: all
        type: public
        sources: [gazette-2002-jubilee]
        note: Fiftieth anniversary of the accession of Queen Elizabeth II.

  - id: gb.diamond-jubilee
    names: {en: Queen’s Diamond Jubilee, cy: Jiwbilî Diemwnt y Frenhines}
    date: {type: list, dates: ["2012-06-05"]}
    observances:
      - regions: all
        type: public
        sources: [gazette-2012-jubilee, govuk-bank-holidays-2018]

  - id: gb.platinum-jubilee
    names: {en: Platinum Jubilee bank holiday, cy: Gŵyl banc Jiwbilî Blatinwm}
    date: {type: list, dates: ["2022-06-03"]}
    observances:
      - regions: all
        type: public
        sources: [govuk-bank-holidays]

  - id: gb.world-cup
    names: {en: World Cup bank holiday, cy: Gŵyl y banc Cwpan y Byd}
    date: {type: list, dates: ["2026-06-15"]}
    observances:
      - regions: [GB-SCT]
        type: public
        sources: [govuk-bank-holidays, govscot-bank-holidays]
        note: Scotland playing in the men's football World Cup; bank holiday approved by the King on the proposal of the First Minister (gov.scot).

  - id: gb.battle-of-the-boyne
    names: {en: Battle of the Boyne (Orangemen’s Day), cy: Brwydr y Boyne (Dydd yr Orenwyr)}
    date: {type: fixed, month: 7, day: 12}
    observances:
      - regions: [GB-NIR]
        type: public
        substitute: {when: {weekday: [sat, sun]}, avoidWeekdays: [sat, sun]}
        sources: [bfda-1971, govuk-bank-holidays]
        note: By Royal Proclamation each year.

  - id: gb.summer-bank
    names: {en: Summer bank holiday, cy: Gŵyl banc yr haf}
    date: {type: nthWeekday, month: 8, weekday: mon, nth: -1}
    observances:
      - regions: all
        except: [GB-SCT]
        type: public
        sources: [bfda-1971, govuk-bank-holidays]
        note: Last Monday in August (Sch. 1 paras. 1 and 3).
      - regions: [GB-SCT]
        type: public
        date: {type: nthWeekday, month: 8, weekday: mon, nth: 1}
        sources: [bfda-1971, govuk-bank-holidays]
        note: First Monday in August (Sch. 1 para. 2).

  - id: gb.state-funeral
    names: {en: Bank Holiday for the State Funeral of Queen Elizabeth II, cy: Gŵyl y Banc ar gyfer Angladd Gwladol y Frenhines Elizabeth II}
    date: {type: list, dates: ["2022-09-19"]}
    observances:
      - regions: all
        type: public
        sources: [govuk-bank-holidays]

  - id: gb.saint-andrew
    names: {en: St Andrew’s Day, cy: Gŵyl Andreas}
    date: {type: fixed, month: 11, day: 30}
    observances:
      - regions: [GB-SCT]
        type: public
        from: 2007
        substitute: {when: {weekday: [sat, sun]}, avoidWeekdays: [sat, sun]}
        sources: [st-andrews-day-act-2007, bfda-1971, govuk-bank-holidays]
        note: Since 16 January 2007. On a Saturday or Sunday the bank holiday is the following Monday (Sch. 1 para. 2 as amended).

  - id: gb.christmas
    names: {en: Christmas Day, cy: Dydd Nadolig}
    date: {type: fixed, month: 12, day: 25}
    observances:
      - regions: all
        type: public
        substitute: {when: {weekday: [sat, sun]}, avoidWeekdays: [sat, sun]}
        sources: [bfda-1971, govuk-bank-holidays]
        note: A bank holiday by Sch. 1 in Scotland; a customary (common law) holiday in England, Wales and Northern Ireland, where 27 December is the bank holiday when 25 or 26 December is a Sunday (Sch. 1) and by proclamation when it is a Saturday.

  - id: gb.boxing-day
    names: {en: Boxing Day, cy: Dydd San Steffan}
    date: {type: fixed, month: 12, day: 26}
    observances:
      - regions: all
        type: public
        substitute: {when: {weekday: [sat, sun]}, avoidWeekdays: [sat, sun]}
        sources: [bfda-1971, govuk-bank-holidays]
        note: Sch. 1 paras. 1 and 3; by Royal Proclamation in Scotland.

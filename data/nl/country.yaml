  - {code: NL-FL, names: {nl: Flevoland, en: Flevoland}}
  - {code: NL-FR, names: {nl: Fryslân, en: Friesland}}
  - {code: NL-GE, names: {nl: Gelderland, en: Gelderland}}
  - {code: NL-GR, names: {nl: Groningen, en: Groningen}}
  - {code: NL-LI, names: {nl: Limburg, en: Limburg}}
  - {code: NL-NB, names: {nl: Noord-Brabant, en: North Brabant}}
  - {code: NL-NH, names: {nl: Noord-Holland, en: North Holland}}
  - {code: NL-OV, names: {nl: Overijssel, en: Overijssel}}
  - {code: NL-UT, names: {nl: Utrecht, en: Utrecht}}
  - {code: NL-ZE, names: {nl: Zeeland, en: Zeeland}}
  - {code: NL-ZH, names: {nl: Zuid-Holland, en: South Holland}}
  - {code: NL-BQ1, names: {nl: Bonaire, en: Bonaire}}
  - {code: NL-BQ2, names: {nl: Saba, en: Saba}}
  - {code: NL-BQ3, names: {nl: Sint Eustatius, en: Sint Eustatius}}

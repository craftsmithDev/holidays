# Andorra. Regions: the 7 parishes (ISO 3166-2:AD). The national holidays do
# not differ between them, so every entry is nationwide. Parish holidays (up to
# four per parish, set by each comú) are not listed (municipal level, out of
# scope).
#
# Types in this file:
# - public: a "dia de festa de compliment obligatori, retribuït i no
#   recuperable" in the yearly Govern decree on the labour calendar
#   (Llei 31/2018 de relacions laborals, Art. 62).
#
# Coverage: 2024-2027, the years for which the decree or the Govern's
# publication of it was read. Other years return nothing.
code: AD
regions:
  - AD-02
  - AD-03
  - AD-04
  - AD-05
  - AD-06
  - AD-07
  - AD-08
sources:
  ad-llei-31-2018:
    title: Llei 31/2018, del 6 de desembre, de relacions laborals
    publisher: Consell General, BOPA núm. 3, 10 de gener del 2019
    law: Llei 31/2018, Art. 62 (Festes laborals)
    url: https://www.consellgeneral.ad/fitxers/documents/lleis-2018/llei-31-2018-de-relacions-laborals
    accessed: "2026-11-15"
  ad-decret-2024:
    title: Decret 487/2023, del 25-10-2023, pel qual s’aprova el calendari laboral corresponent a l’any 2024
    publisher: Govern d’Andorra, BOPA núm. 132, 2 de novembre del 2023 (BOPA page reproduced by addwill.ad)
    law: Decret 487/2023, Art. 1
    url: https://addwill.ad/wp-content/uploads/2023/12/Andorra-Decret-aprovacio-calendari-laboral-2024.pdf
    accessed: "2026-11-15"
  ad-decret-2025:
    title: Decret 409/2024, del 23-10-2024, pel qual s’aprova el calendari laboral corresponent a l’any 2025
    publisher: Govern d’Andorra, BOPA núm. 119, 30 d’octubre del 2024
    law: Decret 409/2024, Art. 1
    url: https://www.govern.ad/documents/1898932/2637160/GD_2024_10_24_14_36_16.pdf/fd9c2b79-c57d-c7af-09f0-8727af22d8a5?t=1731066478995
    accessed: "2026-11-15"
  ad-govern-2026:
    title: S’aprova el calendari laboral per al 2026
    publisher: Govern d’Andorra (press release of 8 October 2025 on the decree, with the list of days)
    url: https://www.govern.ad/ca/w/s-aprova-el-calendari-laboral-per-al-2026
    accessed: "2026-11-15"
  ad-govern-2027:
    title: S’aprova el calendari laboral per al 2027
    publisher: Govern d’Andorra (press release of 21 October 2026 on the decree, with the list of days)
    url: https://www.govern.ad/ca/w/s-aprova-el-calendari-laboral-per-al-2027
    accessed: "2026-11-15"

# Andorra holidays: the 14 days of the yearly labour calendar decree.
#
# Every day is public for construction, industry, offices, banks,
# hairdressers, transport and services not directly related to tourism
# (decree Art. 1). In sectors directly related to tourism the same number of
# days applies, but they may be moved by agreement, except 1 January,
# 14 March, 8 September and 25 December (decree Art. 2).

holidays:
  - id: ad.new-year
    names: {en: New Year’s Day, ca: Cap d’Any}
    date: {type: fixed, month: 1, day: 1}
    observances:
      - {regions: all, type: public, from: 2024, to: 2027, sources: [ad-llei-31-2018, ad-decret-2024, ad-decret-2025, ad-govern-2026, ad-govern-2027]}

  - id: ad.epiphany
    names: {en: Epiphany, ca: Reis}
    date: {type: fixed, month: 1, day: 6}
    observances:
      - regions: all
        type: public
        from: 2024
        to: 2027
        sources: [ad-llei-31-2018, ad-decret-2024, ad-decret-2025, ad-govern-2026, ad-govern-2027]
        note: In sectors directly related to tourism this day may be moved by agreement (decree Art. 2).

  - id: ad.carnival
    names: {en: Carnival, ca: Carnaval}
    note: The decree sets the day each year; 2024 was a Tuesday (20 February), 2025-2027 the Monday before Ash Wednesday.
    date: {type: list, dates: ["2024-02-20", "2025-03-03", "2026-02-16", "2027-02-08"]}
    observances:
      - regions: all
        type: public
        sources: [ad-llei-31-2018, ad-decret-2024, ad-decret-2025, ad-govern-2026, ad-govern-2027]
        note: In sectors directly related to tourism this day may be moved by agreement (decree Art. 2).

  - id: ad.constitution-day
    names: {en: Constitution Day, ca: Dia de la Constitució}
    date: {type: fixed, month: 3, day: 14}
    observances:

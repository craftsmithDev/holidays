# Austria. Regions: the 9 Bundesländer (ISO 3166-2:AT).
#
# Types in this file:
# - public: a Feiertag under the Arbeitsruhegesetz (ARG § 7 para. 2), i.e. a
#   statutory day of rest for employees in the whole country.
# - observance: a day that is off only for some people (members of certain
#   churches before 2019, staff of a Land administration, pupils) or only by
#   custom or collective agreement: Good Friday, the feast days of the
#   Landespatrone, the Carinthian Plebiscite Day, Christmas Eve, New Year's Eve.

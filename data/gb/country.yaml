# United Kingdom. Regions: the four countries of the UK (ISO 3166-2:GB).
# England and Wales share one list; Scotland and Northern Ireland have their
# own (Banking and Financial Dealings Act 1971, Sch. 1, and the yearly Royal
# Proclamations under s. 1).
#
# Types in this file (decision D-gb-1):
# - public: a bank holiday in that part of the UK under the Banking and
#   Financial Dealings Act 1971 (Sch. 1 or a Royal Proclamation under s. 1),
#   the St Andrew's Day Bank Holiday (Scotland) Act 2007, or Christmas Day
#   and Good Friday in England, Wales and Northern Ireland, as listed by
#   gov.uk. Bank holidays are the general public holidays of the UK, but there
#   is no general statutory right to the day off: "Your employer does not have
#   to give you paid leave on bank or public holidays" (gov.uk).
# - bank and observance are not used.
#
# Names: English, and Welsh (cy) where gov.uk/gwyliau-banc gives one. Welsh
# and Scottish Gaelic are regional languages, so they are not in `languages`
# (that would require a name for every day); see decision D-gb-2.
code: GB
names: {en: United Kingdom}
languages: [en]
regions:
  - {code: GB-ENG, names: {en: England, cy: Lloegr}}
  - {code: GB-NIR, names: {en: Northern Ireland, cy: Gogledd Iwerddon}}
  - {code: GB-SCT, names: {en: Scotland, cy: Yr Alban}}
  - {code: GB-WLS, names: {en: Wales, cy: Cymru}}

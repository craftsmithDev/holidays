    title: Feiertage und dienstfreie Tage 2025
    publisher: Liechtensteinische Landesverwaltung, Amt für Personal und Organisation
    url: https://www.llv.li/serviceportal2/amtsstellen/amt-fuer-personal-und-organisation/kalender-der-llv/kalender-2025.pdf
    accessed: "2026-11-15"

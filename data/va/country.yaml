# Vatican City State. No subdivisions.
#
# Types in this file:
# - public: a holiday or "giorno di vacanza" of the personnel regulations
#   of the Holy See and of the Governatorato of the State: Sundays, the
#   holy days of obligation of canon 1246 §1 CIC, and the ten days listed in
#   Regolamento Generale della Curia Romana (1999) Art. 50, Regolamento
#   generale per il personale del Governatorato (2010) Art. 27 and
#   Regolamento del Personale della Curia Romana (2025) Art. 52. The State
#   has no general labour act with its own list; these regulations are the
#   employer rules for nearly everyone who works there (decision D-va-1).
#
# Names are in Italian, the language of the State's laws, and English.
# Latin names are not included (decision D-va-2).
